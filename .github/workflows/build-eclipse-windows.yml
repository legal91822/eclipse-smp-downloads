name: Eclipse Launcher - Compilar EXE Windows (teste)

on:
  push:
    paths:
      - 'launcher-src.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    name: Build Tauri no Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Obter os arquivos do repo
        uses: actions/checkout@v4

      - name: Encontrar o projeto dentro do ZIP
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'launcher-src.zip'
          if (-not (Test-Path -LiteralPath $src)) { throw 'Envie o arquivo launcher-src.zip na RAIZ do repositorio.' }
          $dest = Join-Path $env:RUNNER_TEMP 'eclipse-launcher-source'
          Expand-Archive -LiteralPath $src -DestinationPath $dest -Force
          $candidates = @(Get-ChildItem $dest -Recurse -File -Filter 'package.json' | Where-Object {
            (Test-Path (Join-Path $_.DirectoryName 'src-tauri/Cargo.toml')) -and
            (Test-Path (Join-Path $_.DirectoryName 'src-tauri/tauri.conf.json'))
          })
          if ($candidates.Count -ne 1) { throw "Esperado exatamente 1 projeto Tauri; encontrados $($candidates.Count)." }
          $proj = $candidates[0].DirectoryName
          "ECLIPSE_PROJECT_DIR=$proj" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias do frontend
        shell: pwsh
        run: |
          Set-Location $env:ECLIPSE_PROJECT_DIR
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install falhou' }

      - name: Teste de Python do projeto
        shell: pwsh
        run: |
          Set-Location $env:ECLIPSE_PROJECT_DIR
          python tools/test_alpha8.py
          if ($LASTEXITCODE -ne 0) { throw 'Teste de distribuicao falhou' }

      - name: Compilar e testar Rust
        shell: pwsh
        run: |
          Set-Location $env:ECLIPSE_PROJECT_DIR
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { throw 'Cargo test falhou' }

      - name: Build Tauri Windows NSIS
        shell: pwsh
        run: |
          Set-Location $env:ECLIPSE_PROJECT_DIR
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Build Tauri falhou' }
          $exe = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($exe.Count -eq 0) { throw 'Nenhum instalador EXE gerado.' }

      - name: Disponibilizar o instalador de teste
        uses: actions/upload-artifact@v4
        with:
          name: EclipseLauncher-Windows-UNSIGNED-TEST
          path: ${{ env.ECLIPSE_PROJECT_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
